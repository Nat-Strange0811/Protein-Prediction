name: protein_prediction
channels:
  - conda-forge
dependencies:
  - python=3.10
  - polars
  - pandas
  - numpy
  - requests
  - pyarrow
  - pyyaml
  - pydantic
  - python-dotenv
  - scikit-learn
  - httpx
  - tenacity
  - pip
  - pip:
    # GPU nodes on this cluster have drivers supporting up to CUDA 12.9, so torch
    # must be pinned to the cu126 build - plain "torch" on PyPI now defaults to a
    # CUDA 13 build the driver can't run.
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.12.0+cu126
    - torchvision==0.27.0+cu126
    - esm
    - transformers
    - dscript
    - -e ../Code/